name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to upload and publish (blank for test build)
        required: false
        type: string
      scope:
        description: Platforms to build for a non-publishing test run
        required: true
        default: linux
        type: choice
        options:
          - linux
          - all

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      revision: ${{ steps.target.outputs.revision }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - name: Resolve build revision and check draft release
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            git check-ref-format "refs/tags/$RELEASE_TAG"
            draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            if [[ "$draft" != true ]]; then
              echo "::error::The release must be a draft; published releases cannot receive assets."
              exit 1
            fi
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
            revision=$(git rev-parse 'FETCH_HEAD^{commit}')
          else
            revision=$(git rev-parse HEAD)
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  release:
    name: release ${{ matrix.os }}
    needs: prepare
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.release_tag == '' && inputs.scope == 'linux' && '["ubuntu-22.04"]' || '["ubuntu-22.04","macos-15"]') }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        if: runner.os == 'Linux'
      - name: Build release artifacts
        run: nix build --log-lines 1000 .#release
      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dpkg-dev
      - name: Build DEB and RPM release artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-binaries release-packages

          prepare_release_binary() {
            local archive_arch=$1
            local target=$2
            local archives

            mkdir -p "release-binaries/$archive_arch"
            archives=(result/elfshaker_*_"$target".tar.gz)
            test "${#archives[@]}" -eq 1
            tar -xzf "${archives[0]}" \
              -C "release-binaries/$archive_arch" \
              --strip-components=1 \
              elfshaker/elfshaker
          }

          package_deb() {
            local archive_arch=$1
            local deb_arch=$2

            contrib/packages/deb/build.sh \
              --binary "release-binaries/$archive_arch/elfshaker" \
              --architecture "$deb_arch" \
              --preserve-binary \
              --output-dir release-packages
          }

          package_and_test_rpm() {
            local archive_arch=$1
            local container_arch=$2
            local rpm_arch=$3

            docker run --rm \
              --platform "linux/$container_arch" \
              --volume "$PWD:/workspace" \
              --workdir /workspace \
              rockylinux:9 \
              bash -euxo pipefail -c "
                dnf install --assumeyes \
                  --setopt=install_weak_deps=False \
                  diffutils rpm-build
                contrib/packages/rpm/build.sh \
                  --binary release-binaries/$archive_arch/elfshaker \
                  --architecture $rpm_arch \
                  --preserve-binary \
                  --output-dir release-packages
                package=\$(find release-packages \
                  -name 'elfshaker-*.$rpm_arch.rpm' -print -quit)
                test -n \"\$package\"
                rpm -ivh \"\$package\"
                elfshaker --version
                test -r /usr/share/man/man1/elfshaker.1.gz
                cmp /usr/bin/elfshaker \
                  release-binaries/$archive_arch/elfshaker
                rpm -V elfshaker
              "
          }

          prepare_release_binary x86_64 x86_64-unknown-linux-musl
          prepare_release_binary aarch64 aarch64-unknown-linux-musl
          package_deb x86_64 amd64
          package_deb aarch64 arm64
          package_and_test_rpm x86_64 amd64 x86_64
          package_and_test_rpm aarch64 arm64 aarch64

          packages=(release-packages/*.deb release-packages/*.rpm)
          test "${#packages[@]}" -eq 4
          for package in "${packages[@]}"; do
            sha256sum "$package" >"$package.sha256sum"
          done
      - name: Collect workflow artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workflow-artifacts
          cp result/* workflow-artifacts/
          if [[ "${{ runner.os }}" == Linux ]]; then
            cp release-packages/* workflow-artifacts/
          fi
      - name: Retain workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.os }}
          path: workflow-artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Upload release artifacts
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" workflow-artifacts/* --clobber

  publish:
    if: inputs.release_tag != ''
    needs: [prepare, release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish draft after every platform uploads successfully
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release edit "$RELEASE_TAG" --draft=false

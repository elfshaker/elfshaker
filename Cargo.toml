[package]
name = "elfshaker"
version = "1.0.0-rc1"
authors = ["Veselin Karaganev <veselin.karaganev@arm.com>", "Peter Waller <peter.waller@arm.com>"]
edition = "2018"
description = "A low-footprint, high-performance version control system fine-tuned for binaries"
license = "Apache-2.0"
repository = "https://github.com/elfshaker/elfshaker"
homepage = "https://github.com/elfshaker/elfshaker"
readme = "README.md"
keywords = ["binary", "compression", "deduplication", "vcs"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "elfshaker"
path = "src/bin/elfshaker/main.rs"

[dependencies]
zstd = { version = "0.14.3", features = ["zstdmt"] }
crossbeam-utils = "0.8"
walkdir = "2.5.0"
clap = { version = "4", features = ["color", "env", "error-context", "help", "usage"] }
sha1 = "0.11"
hashbrown = "0.17.1"
hex = "0.4.3"
chrono = "0.4.45"
url = "2.5.8"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive", "rc"] }
rmp = "0.8.15"
rmp-serde = "1.3.1"
num_cpus = "1.17.0"
log = "0.4.35"
lazy_static = "1.5.1"
libc = "0.2.191"
rand = "0.10.3"
fs2 = "0.4.3"
winapi = { version = "0.3.9", features = ["everything"] }
unicode-general-category = "1.1.0"

[dev-dependencies]
clap_mangen = "0.3.0"
